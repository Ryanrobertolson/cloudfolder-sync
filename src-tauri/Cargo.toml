[package]
name = "cloudfolder-sync"
version = "0.6.0"
description = "Safe scheduled cloud backups for Ubuntu"
authors = ["CloudFolder contributors"]
edition = "2021"

[lib]
name = "cloudfolder_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
thiserror = "2.0.17"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "time"] }
